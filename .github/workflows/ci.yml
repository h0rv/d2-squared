name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Format
        working-directory: engine
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: engine
        run: go vet ./...
      - name: Vet (wasm)
        working-directory: engine
        run: GOOS=js GOARCH=wasm go vet ./wasm
      - name: Test
        working-directory: engine
        run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.5.0
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Format
        working-directory: web
        run: npm run format:check
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build the site (builds the wasm engine too)
        working-directory: web
        run: npm run build
      - name: Build the web UI for the local server
        working-directory: web
        run: npm run build:embed
      - name: Install the browsers
        working-directory: web
        run: npx playwright install --with-deps chromium firefox
      - name: End-to-end tests (Chromium and Firefox)
        working-directory: web
        run: npm test
      - uses: actions/upload-artifact@v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: web/test-results
